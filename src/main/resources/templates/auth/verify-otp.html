<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Xác nhận OTP')}"></head>
<body>
<div class="auth-page">
<div class="auth-card">
    <form th:action="@{/verify-otp}" th:object="${verifyOtpDTO}" method="post">
        <h1>Xác nhận OTP</h1>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <div th:if="${#fields.hasGlobalErrors()}" class="alert error">
            <p th:each="e : ${#fields.globalErrors()}" th:text="${e}"></p>
        </div>
        
        <label>Email</label>
        <input type="email" th:field="*{email}" placeholder="Nhập email của bạn" required>

        <label>Mã OTP 6 số</label>
        <input type="text" th:field="*{otp}" maxlength="6" inputmode="numeric" placeholder="Nhập mã OTP 6 số" required autofocus style="letter-spacing: 4px; font-size: 16px; font-weight: 600; text-align: center;">

        <div style="margin-top: 20px;">
            <button class="button full" type="submit">Xác nhận kích hoạt</button>
        </div>
    </form>

    <form th:action="@{/resend-register-otp}" method="post" style="margin-top: 12px;">
        <input type="hidden" name="email" th:value="${verifyOtpDTO.email}">
        <button class="button secondary full" type="submit">Gửi lại mã OTP</button>
    </form>

    <p>
        <a th:href="@{/login}">Quay lại Login</a>
    </p>
</div>
</div>
</body>
</html>
