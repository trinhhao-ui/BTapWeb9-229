<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layouts/layout :: head('Quản lý Users')}"></head>
<body>
<div th:replace="~{layouts/layout :: page(~{::main})}">
<main>
    <div class="page-header">
        <h1>Quản lý Users</h1>
    </div>

    <div th:if="${success}" class="alert success" th:text="${success}"></div>
    <div th:if="${error}" class="alert error" th:text="${error}"></div>

    <div class="toolbar">
        <form th:action="@{/users}" method="get">
            <input name="keyword" th:value="${keyword}" placeholder="Tìm kiếm theo username, email, họ tên...">
            <input type="hidden" name="size" th:value="${size}">
            <button class="button" type="submit">Tìm kiếm</button>
        </form>
        <a class="button" th:href="@{/users/create}">+ Thêm User</a>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Họ tên</th>
                <th>Role</th>
                <th>Trạng thái</th>
                <th>Sản phẩm</th>
                <th>Thao tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="u : ${users.content}">
                <td th:text="${u.id}"></td>
                <td><strong th:text="${u.username}"></strong></td>
                <td th:text="${u.email}"></td>
                <td th:text="${u.fullName}"></td>
                <td>
                    <span th:if="${u.roleName == 'ROLE_ADMIN'}" class="badge badge-admin">ADMIN</span>
                    <span th:unless="${u.roleName == 'ROLE_ADMIN'}" class="badge badge-user">USER</span>
                </td>
                <td>
                    <span th:if="${u.enabled}" class="badge badge-active">ACTIVE</span>
                    <span th:unless="${u.enabled}" class="badge badge-inactive">INACTIVE</span>
                </td>
                <td>
                    <span class="badge badge-count" th:text="${u.productCount}">0</span>
                </td>
                <td class="actions">
                    <a class="btn-action btn-edit" th:href="@{/users/edit/{id}(id=${u.id})}">Edit</a>
                    <form th:if="${#authentication.name != u.username}"
                          th:action="@{/users/delete/{id}(id=${u.id})}" method="post"
                          onsubmit="return confirm('Bạn có chắc muốn xóa user này không?');">
                        <button class="btn-action btn-delete" type="submit">Delete</button>
                    </form>
                    <span th:if="${#authentication.name == u.username}" class="badge badge-current">Hiện tại</span>
                </td>
            </tr>
            <tr th:if="${users.empty}">
                <td colspan="8" style="text-align: center; padding: 32px; color: #94a3b8;">Không tìm thấy dữ liệu người dùng.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" th:if="${users.totalPages > 1}">
        <a th:if="${users.hasPrevious()}"
           th:href="@{/users(page=${users.number - 1},size=${size},keyword=${keyword})}">«</a>
        <span th:each="i : ${#numbers.sequence(0, users.totalPages - 1)}">
            <a th:classappend="${i == users.number ? 'active' : ''}"
               th:href="@{/users(page=${i},size=${size},keyword=${keyword})}"
               th:text="${i+1}"></a>
        </span>
        <a th:if="${users.hasNext()}"
           th:href="@{/users(page=${users.number + 1},size=${size},keyword=${keyword})}">»</a>
    </div>
</main>
</div>
</body>
</html>
